name: Package release

on:
  workflow_call:

concurrency:
  group: package-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.changes.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check VERSION content
        id: changes
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [[ "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
            BEFORE=$(git hash-object -t tree /dev/null)
          elif ! git cat-file -e "$BEFORE^{commit}"; then
            git fetch --no-tags origin "$BEFORE"
          fi
          changed=$(git diff --name-only "$BEFORE" "$AFTER" -- VERSION)
          echo "release=$([[ -n "$changed" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  package:
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Verify LFS assets
        run: git lfs fsck
      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
      - name: Set up Python and dependencies
        run: uv sync --frozen
      - name: Read release version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+_\d+\.\d+\.\d+\.\d+$') {
            throw "VERSION must use the Ankama X.Y_A.B.C.D format, got: $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Build Windows package
        run: uv run poe package
      - name: Validate packaged startup and shutdown
        run: uv run python scripts/validate_package.py dist/Bot-DofusUnity
      - name: Create release archive
        shell: pwsh
        run: |
          Compress-Archive -Path dist/Bot-DofusUnity -DestinationPath dist/Bot-DofusUnity-${{ steps.version.outputs.version }}.zip -CompressionLevel Optimal
          $asset = Get-Item dist/Bot-DofusUnity-${{ steps.version.outputs.version }}.zip
          if ($asset.Length -gt 2GB) {
            throw "Release asset exceeds the 2 GiB GitHub limit: $($asset.Length) bytes"
          }
      - name: Replace latest release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $releases = gh release list --limit 1000 --json tagName | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Failed to list releases" }
          if ($releases.tagName -contains 'latest') {
            gh release delete latest --cleanup-tag --yes
            if ($LASTEXITCODE -ne 0) { throw "Failed to delete the previous latest release" }
          }
          gh release create latest "dist/Bot-DofusUnity-$env:RELEASE_VERSION.zip" --target $env:GITHUB_SHA --title $env:RELEASE_VERSION --notes "Version $env:RELEASE_VERSION" --latest
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish the latest release" }
