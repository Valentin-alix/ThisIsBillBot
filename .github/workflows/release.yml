name: Package release

on:
  push:
    branches:
      - '**'
    paths:
      - VERSION
      - 'DBDofusUnity/datas/bundles/**'
      - 'DBDofusUnity/datas/protos/**'

permissions:
  contents: write

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.changes.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check release inputs
        id: changes
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [[ "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
            BEFORE=$(git hash-object -t tree /dev/null)
          elif ! git cat-file -e "$BEFORE^{commit}"; then
            git fetch --no-tags origin "$BEFORE"
          fi
          if git diff --quiet "$BEFORE" "$AFTER" -- VERSION DBDofusUnity/datas/bundles/ DBDofusUnity/datas/protos/; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [[ "$status" != 1 ]]; then
              exit "$status"
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  package:
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Verify LFS assets
        run: git lfs fsck
      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
      - name: Set up Python and dependencies
        run: uv sync --frozen
      - name: Read release version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+_\d+\.\d+\.\d+\.\d+$') {
            throw "VERSION must use the Ankama X.Y_A.B.C.D format, got: $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Build Windows package
        run: uv run poe package
      - name: Validate packaged startup and shutdown
        run: uv run python scripts/validate_package.py dist/Bot-DofusUnity
      - name: Create release archive
        shell: pwsh
        run: Compress-Archive -Path dist/Bot-DofusUnity -DestinationPath dist/Bot-DofusUnity-${{ steps.version.outputs.version }}.zip -CompressionLevel Optimal
      - name: Check release asset size
        shell: pwsh
        run: |
          $asset = Get-Item dist/Bot-DofusUnity-${{ steps.version.outputs.version }}.zip
          if ($asset.Length -gt 2GB) {
            throw "Release asset exceeds the 2 GiB GitHub limit: $($asset.Length) bytes"
          }
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          prerelease: true
          generate_release_notes: false
          files: dist/Bot-DofusUnity-${{ steps.version.outputs.version }}.zip
