syntax = "proto3";

import "common.proto";
import "appearance.proto";

package com.ankama.dofus.server.game.protocol.cosmetic;

enum UnknownOneHundredThirtyFour {
	UNKNOWN_ONE_HUNDRED_THIRTY_FOUR = 0;
}

enum UnknownOneHundredThirtyFive {
	UNKNOWN_ONE_HUNDRED_THIRTY_FIVE = 0;
}

enum UnknownOneHundredThirtySix {
	UNKNOWN_ONE_HUNDRED_THIRTY_SIX = 0;
}


enum ObjectSlot {
	AMULET = 0;
	RING_LEFT = 1;
	RING_RIGHT = 2;
	BELT = 3;
	BOOTS = 4;
	PETMOUNT = 5;
	DRAGOTURKEY = 6;
	RHINEETLE = 7;
	SEEMYOOL = 8;
	CAPE = 9;
	HAT = 10;
	PET = 11;
	SHIELD = 12;
	BOW = 13;
	WAND = 14;
	STAFF = 15;
	DAGGER = 16;
	SCYTHE = 17;
	AXE = 18;
	LANCE = 19;
	HAMMER = 20;
	SHOVEL = 21;
	SWORD = 22;
	DISGUISE = 23;
	WINGS = 24;
	SHOULDERS = 25;
}

message CosmeticInventoryLoadedEvent {
	repeated .com.ankama.dofus.server.game.protocol.common.ObjectItem objects = 1;
}

message CosmeticInventoryAddObjectRequest {
	int32 uid = 1;
}

message CosmeticInventoryAddObjectResponse {
	.com.ankama.dofus.server.game.protocol.cosmetic.CosmeticInventoryAddObjectResponse.Result result = 1;
	enum Result {
		ERROR = 0;
		DUPLICATE = 1;
		SUCCESS = 2;
	}

}

message CosmeticInventoryPopObjectRequest {
	int32 gid = 1;
}

message CosmeticInventoryPopObjectResponse {
	bool success = 1;
}

message CosmeticInventoryLivingObjectFeedRequest {
	int32 gid = 1;
	int32 food_object_uid = 2;
}

message CosmeticInventoryLivingObjectFeedResponse {
	bool success = 1;
	.com.ankama.dofus.server.game.protocol.common.ObjectItem living_object_fed = 2;
}

message CosmeticInventoryAddedEvent {
	.com.ankama.dofus.server.game.protocol.common.ObjectItem object = 1;
}

message OutfitEquipAuraRequest {
	optional int32 emote_id = 1;
}

message OutfitEquipAuraResponse {
	bool success = 1;
}

message OutfitAuraChangedEvent {
	optional int32 emote_id = 1;
}

message OutfitEquipTitleRequest {
	optional int32 title_id = 1;
}

message OutfitEquipTitleResponse {
	bool success = 1;
	bool is_owned = 2;
}

message OutfitEquipOrnamentRequest {
	optional int32 ornament_id = 1;
}

message OutfitEquipOrnamentResponse {
	bool success = 1;
}

message OutfitEquipObjectRequest {
	.com.ankama.dofus.server.game.protocol.cosmetic.ObjectSlot slot = 2;
	optional int32 gid = 1;
	optional int32 skin_id = 3;
}

message OutfitEquipObjectResponse {
	bool success = 1;
}

message OutfitEquipObjectBestSlotRequest {
	int32 gid = 1;
	optional int32 skin_id = 2;
}

message OutfitEquipObjectBestSlotResponse {
	bool success = 1;
	optional .com.ankama.dofus.server.game.protocol.cosmetic.ObjectSlot slot = 2;
}

message OutfitEquipFaceRequest {
	int32 face_id = 1;
}

message OutfitEquipFaceResponse {
	bool success = 1;
}

message OutfitEquipColorsRequest {
	.com.ankama.dofus.server.game.protocol.cosmetic.ColorPalette color_palette = 1;
}

message OutfitEquipColorsResponse {
	bool success = 1;
}

message OutfitUpdateRequest {
	string outfit_uuid = 1;
	string name = 2;
	int32 pictogram_id = 3;
	bool favorite = 4;
}

message OutfitUpdateResponse {
	bool success = 1;
}

message OutfitCreateEmptyRequest {
	string name = 1;
	int32 pictogram_id = 2;
	int32 face_id = 3;
	.com.ankama.dofus.server.game.protocol.cosmetic.ColorPalette color_palette = 4;
}

message OutfitDuplicateRequest {
	string outfit_uuid = 1;
	string name = 2;
	int32 pictogram_id = 3;
}

message OutfitCreationResponse {
	bool success = 1;
	optional .com.ankama.dofus.server.game.protocol.cosmetic.Outfit outfit_created = 2;
}

message OutfitRemoveRequest {
	string outfit_uuid = 1;
}

message OutfitRemoveResponse {
	bool success = 1;
}

message OutfitEquipRequest {
	string outfit_uuid = 1;
}

message OutfitEquipResponse {
	bool success = 1;
}

message OutfitsLoadedEvent {
	.com.ankama.dofus.server.game.protocol.cosmetic.Outfit current = 1;
	repeated .com.ankama.dofus.server.game.protocol.cosmetic.Outfit outfits = 2;
}

message OutfitEntityLookChangedEvent {
	string outfit_uuid = 1;
	.com.ankama.dofus.server.game.protocol.common.EntityLook entity_look = 2;
}

message Outfit {
	string uuid = 1;
	string name = 2;
	int32 pictogram_id = 3;
	map<int32, .com.ankama.dofus.server.game.protocol.cosmetic.Outfit.SkinOutfit> objects = 4;
	optional int32 aura_emote_id = 5;
	optional int32 ornament_id = 6;
	optional int32 title_id = 7;
	optional .com.ankama.dofus.server.game.protocol.common.EntityLook entity_look = 8;
	bool favorite = 9;
	string last_modified = 10;
	int32 face_id = 11;
	.com.ankama.dofus.server.game.protocol.cosmetic.ColorPalette color_palette = 12;

	message SkinOutfit {
		int32 gid = 1;
		optional int32 skin = 2;
	}

}



message UnknownOneHundredFortySix {
	bool unknown_three_hundred_eleven = 1;
}

message UnknownOneHundredFortySeven {
	.com.ankama.dofus.server.game.protocol.cosmetic.Outfit unknown_three_hundred_twelve = 1;
}

message UnknownOneHundredFortyEight {
	UnknownOneHundredThirtyFour unknown_three_hundred_thirteen = 1;
}

message UnknownOneHundredFortyNine {
	bool unknown_three_hundred_fourteen = 1;
}

message OutfitEntityLookChangeRequest {
	.com.ankama.dofus.server.game.protocol.cosmetic.ObjectSlot slot = 1;
	bool hide = 2;
}

message OutfitEntityLookChangeResponse {
	bool hide = 1;
}

message OutfitDetailResponse {
	bool success = 1;
	UnknownOneHundredThirtyTwo unknown_two_hundred_ninety = 2;
	.com.ankama.dofus.server.game.protocol.cosmetic.Outfit outfit = 3;
	enum UnknownOneHundredThirtyTwo {
		UNKNOWN_ONE_HUNDRED_THIRTY_TWO_UNSPECIFIED = 0;
	}
}

message OutfitSaveRequest {
	int32 unknown_two_hundred_ninety_one = 1;
	string name = 2;
	UnknownOneHundredThirtyThree unknown_two_hundred_ninety_two = 3;
	enum UnknownOneHundredThirtyThree {
		UNKNOWN_ONE_HUNDRED_THIRTY_THREE_UNSPECIFIED = 0;
	}
}

message UnknownOneHundredFifty {
	map<int32, .com.ankama.dofus.server.game.protocol.cosmetic.UnknownOneHundredFifty.UnknownOneHundredFiftyOne> unknown_three_hundred_fifteen = 1;
	UnknownOneHundredThirtyFive unknown_three_hundred_sixteen = 2;
	message UnknownOneHundredFiftyOne {
	}
}

message UnknownOneHundredFiftyTwo {
	bool unknown_three_hundred_seventeen = 1;
}

message UnknownOneHundredFiftyThree {
	map<int32, UnknownOneHundredThirtySix> unknown_three_hundred_eighteen = 1;
}

message UnknownOneHundredFiftyFour {
	repeated int32 unknown_three_hundred_nineteen = 1;
}

message UnknownOneHundredFiftyFive {
	string unknown_three_hundred_twenty = 1;
	int32 unknown_three_hundred_twenty_one = 2;
}

message OutfitDetailRequest {
	string outfit_uuid = 1;
}

message UnknownOneHundredFiftySix {
	bool unknown_three_hundred_twenty_two = 1;
}

message OutfitMenuRequest {
}
