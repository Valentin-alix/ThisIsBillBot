syntax = "proto3";

import "ladder.proto";

package com.ankama.dofus.server.game.protocol.ladder.achievement;

message UnknownThreeHundredSixty {
	int32 unknown_six_hundred_sixty_four = 1;
	string unknown_six_hundred_sixty_five = 2;
}

message AchievementLadderPageEvent {
	repeated .com.ankama.dofus.server.game.protocol.ladder.achievement.AchievementLadderEntry entries = 1;
}

message AchievementLadderEntry {
	int64 rank = 1;
	int64 success = 2;
	.com.ankama.dofus.server.game.protocol.ladder.LadderCharacter info = 3;
}

message AchievementLadderPageRequest {
	int32 server_id = 1;
}

message UnknownThreeHundredSixtyOne {
	repeated .com.ankama.dofus.server.game.protocol.ladder.achievement.AchievementLadderEntry entries = 1;
}

message AchievementLadderSelfRankEvent {
	.com.ankama.dofus.server.game.protocol.ladder.achievement.AchievementLadderEntry entry = 1;
}

message AchievementLadderSelfRankRequest {
	int32 server_id = 1;
}
