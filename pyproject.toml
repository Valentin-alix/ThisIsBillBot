[project]
name = "voldemort"
version = "0.1.0"
description = ""
authors = [{ name = "Valentin Alix", email = "valentin-alix.850@outlook.fr" }]
requires-python = ">3.12,<3.13"
readme = "README.md"

dependencies = [
    "db-dofus-unity",
    "ankama-launcher-emulator-premium",
    "scapy>=2.5.0,<3",
    "psutil>=6.0.0,<7",
    "cachetools>=7.0.5",
    "msgspec>=0.20.0",
    "protobuf==5.28.3",
    "sortedcontainers>=2.4.0,<3",
    "proto-schema-parser>=1.4.8,<2",
    "schedule>=1.2.2,<2",
    "python-dotenv>=1.1.0,<2",
    "pulp>=3.2.1,<4",
    "datamodel-code-generator>=0.30.2,<0.31",
    "openapi-python-client>=0.26",
    "pandas>=2.3.3,<3",
    "scikit-learn>=1.7.2,<2",
    "fastparquet>=2024.11.0,<2025",
    "langchain-openai>=1.0.3,<2",
    "langchain-community>=0.4.1,<0.5",
    "langchain>=1.2.6",
    "pycryptodomex>=3.23.0",
    "thrift>=0.20.0,<0.21",
    "wmi>=1.5.1; sys_platform == 'win32'",
    "pysocks>=1.7.1,<2.0.0",
    "pydantic>=2.11.10",
    "playwright>=1.58.0",
    "requests[socks]>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pyqt6-fluent-widgets>=1.11.1",
    "vulture>=2.16",
    "pyarrow-stubs>=20.0.0.20251215",
    "faker>=40.18.0",
    "base-python",
]

[dependency-groups]
dev = [
    "ruff>=0.12.12",
    "poethepoet>=0.42.1",
    "watchfiles>=1.1.1",
    "pyright>=1.1.408",
    "PyQt6-stubs>=6.6.0",
    "types-cachetools>=5.5.0.20240820",
    "tqdm>=4.66.5,<5",
    "icecream>=2.1.3,<3",
    "coverage>=7.13.1",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pandas-stubs>=2.3.3.251219",
    "types-psutil>=7.1.3.20251211",
    "types-python-dateutil>=2.9.0.20251115",
    "scipy-stubs>=1.16.3.3",
    "types-protobuf>=6.32.1.20251210",
    "types-requests>=2.32.4.20250913,<3",
]

[tool.uv]
package = false

[tool.uv.sources]
ankama-launcher-emulator-premium = { workspace = true, editable = true }
db-dofus-unity = { workspace = true, editable = true }
base-python = { git = "https://github.com/Valentin-alix/base-python.git" }

[tool.uv.workspace]
members = [
    "AnkamaLauncherEmulatorPremium",
    "DBDofusUnity",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.poe.tasks]
dead_code = "vulture src AnkamaLauncherEmulatorPremium/ankama_launcher_emulator_premium scripts/vulture_whitelist.py --exclude \"*gen_zaap*,*proxy/dofus3/login_message_pb2.py\" --min-confidence 80"
check_type = "pyright"
lint = "ruff check . --fix"
format = "ruff format ."
check = ["lint", "check_type"]
test = "coverage run --source=src -m pytest tests DBDofusUnity/tests AnkamaLauncherEmulatorPremium/tests"
verify = ["lint", "check_type", "test"]


[tool.pytest.ini_options]
testpaths = ["tests", "DBDofusUnity/tests", "AnkamaLauncherEmulatorPremium/tests"]
pythonpath = ["."]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-s",
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib"
]

[tool.ruff]
extend = ".venv/Lib/site-packages/base_python/pyproject.toml"
exclude = [
  "DBDofusUnity/datas",
  "DBDofusUnity/.venv",
  "DBDofusUnity/Il2CppInspectorRedux",
  "DBDofusUnity/protodec",
  "DBDofusUnity/UABEA",
  "AnkamaLauncherEmulatorPremium/ankama_launcher_emulator_premium/gen_zaap",
  "AnkamaLauncherEmulatorPremium/ankama_launcher_emulator_premium/proxy/dofus3/login_message*",
]
