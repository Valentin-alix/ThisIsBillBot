[project]
name = "bot_dofus_unity"
version = "0.1.0"
description = ""
authors = [{ name = "Valentin Alix", email = "valentin-alix.850@outlook.fr" }]
requires-python = ">3.12,<3.14"
readme = "README.md"
dependencies = [
    "pydantic>2.8",
    "scapy>=2.5.0,<3",
    "psutil>=6.0.0,<7",
    "pyqt5-qt5==5.15.2",
    "pyqt5==5.15.10",
    "pyqt-fluent-widgets[full]>=1.6.3,<2",
    "cachetools>=5.5.0,<6",
    "msgspec>=0.18.6,<0.19",
    "protobuf==5.28.3",
    "sortedcontainers>=2.4.0,<3",
    "mypy>=1.15.0,<2",
    "proto-schema-parser>=1.4.8,<2",
    "frida>=16.7.3,<17",
    "frida-tools>=13.6.1,<14",
    "tinydb>=4.8.2,<5",
    "ujson>=5.10.0,<6",
    "orjson>=3.10.18,<4",
    "schedule>=1.2.2,<2",
    "python-dotenv>=1.1.0,<2",
    "line-profiler>=4.2.0,<5",
    "pyinstaller>=6.13.0,<7",
    "pulp>=3.2.1,<4",
    "datamodel-code-generator>=0.30.2,<0.31",
    "openapi-python-client>=0.25.3,<0.26",
    "pandas>=2.3.3,<3",
    "scikit-learn>=1.7.2,<2",
    "fastparquet>=2024.11.0,<2025",
    "types-requests>=2.32.4.20250913,<3",
    "langchain>=1.0.7,<2",
    "langchain-openai>=1.0.3,<2",
    "langchain-community>=0.4.1,<0.5",
    "psycopg2>=2.9.11,<3",
    "ankama-launcher-emulator",
    "watchfiles>=1.1.1",
    "ruff>=0.12.12",
    "types-psutil>=7.1.3.20251211",
    "types-python-dateutil>=2.9.0.20251115",
    "scipy-stubs>=1.16.3.3",
    "types-protobuf>=6.32.1.20251210",
]

[dependency-groups]
dev = [
    "pyqt5-stubs>=5.15.6.0,<6",
    "types-cachetools>=5.5.0.20240820,<6",
    "tqdm>=4.66.5,<5",
    "icecream>=2.1.3,<3",
    "pyinstaller>=6.11.1,<7",
]

[tool.uv]
package = false

[tool.uv.sources]
ankama-launcher-emulator = { git = "https://github.com/Valentin-alix/AnkamaLauncherEmulator.git" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.poe.tasks]
genapi = "openapi-python-client generate --url http://31.38.182.64:65472/openapi.json --overwrite --output-path scraping_d3_client --config scraping_d3.yaml"

[tool.pylint]
exclude = ["__init__.py", "__init__.pyi", "env.py", ".venv/**/*"]
ignore = ["E402"]
line-length = 200