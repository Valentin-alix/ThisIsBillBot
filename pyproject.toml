[project]
name = "bot_dofus_unity"
version = "0.1.0"
description = ""
authors = [{ name = "Valentin Alix", email = "valentin-alix.850@outlook.fr" }]
requires-python = ">3.12,<3.14"
readme = "README.md"

dependencies = [
    "ankama-launcher-emulator",
    "scapy>=2.5.0,<3",
    "psutil>=6.0.0,<7",
    "cachetools>=5.5.0,<6",
    "msgspec>=0.18.6,<0.19",
    "protobuf==5.28.3",
    "sortedcontainers>=2.4.0,<3",
    "proto-schema-parser>=1.4.8,<2",
    "frida>=16.7.3,<17",
    "schedule>=1.2.2,<2",
    "python-dotenv>=1.1.0,<2",
    "pulp>=3.2.1,<4",
    "datamodel-code-generator>=0.30.2,<0.31",
    "openapi-python-client>=0.25.3,<0.26",
    "pandas>=2.3.3,<3",
    "scikit-learn>=1.7.2,<2",
    "fastparquet>=2024.11.0,<2025",
    "langchain-openai>=1.0.3,<2",
    "langchain-community>=0.4.1,<0.5",
    "langchain>=1.2.6",
    "pycryptodomex>=3.23.0",
    "thrift>=0.20.0,<0.21",
    "wmi>=1.5.1",
    "pysocks>=1.7.1,<2.0.0",
    "pydantic>=2.11.10",
    "playwright>=1.58.0",
    "pyqt6-fluent-widgets>=1.11.1",
    
]

[dependency-groups]
dev = [
    "ruff>=0.12.12",
    "poethepoet>=0.42.1",
    "frida-tools>=13.6.1,<14",
    "pyinstaller>=6.13.0,<7",
    "psycopg2>=2.9.11,<3",
    "watchfiles>=1.1.1",
    "pyright>=1.1.408",
    "ruff>=0.12.12",
    "PyQt6-stubs>=6.6.0",
    "types-cachetools>=5.5.0.20240820,<6",
    "tqdm>=4.66.5,<5",
    "icecream>=2.1.3,<3",
    "pyinstaller>=6.11.1,<7",
    "coverage>=7.13.1",
    "types-psycopg2>=2.9.21.20251012",
    "pandas-stubs>=2.3.3.251219",
    "types-psutil>=7.1.3.20251211",
    "types-python-dateutil>=2.9.0.20251115",
    "scipy-stubs>=1.16.3.3",
    "types-protobuf>=6.32.1.20251210",
    "types-requests>=2.32.4.20250913,<3",
]

[tool.uv]
package = false

[tool.uv.sources]
ankama-launcher-emulator = { workspace = true, editable = true }

[tool.uv.workspace]
members = [
    "AnkamaLauncherEmulator",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.poe.tasks]
genapi = "openapi-python-client generate --url http://31.38.182.64:65472/openapi.json --overwrite --output-path scraping_d3_client --config scraping_d3.yaml"
check_type = "pyright"
lint = "ruff check ."
check = ["lint", "check_type"]

[tool.ruff.lint]
ignore = ["F841", "E402", "E741"]

[tool.ruff]
exclude = [
  "src/controller/scraping_d3_api/scraping_d3_client/scraping_d3_client",
  "tests",
  "D3Mapping/d3_mapping/resources",
  "D3Mapping/IL2CppDumper",
  "AnkamaLauncherEmulator/ankama_launcher_emulator/gen_zaap",
  "AnkamaLauncherEmulator/ankama_launcher_emulator/proxy/dofus3/login_message*",
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["ALL"]

[tool.pyright]
venvPath = "."
extraPaths = ["AnkamaLauncherEmulator"]
venv = ".venv"
exclude = [
  "**/IL2CppDumper",
  "**/.venv",
  "AnkamaLauncherEmulator/ankama_launcher_emulator/gen_zaap",
  "**/node_modules",
  "**/__pycache__",
  "**/.*"
]
ignore = [
  "D3Mapping/d3_mapping/resources"
]

