[project]
name = "voldemort"
version = "0.1.0"
description = "Python framework for Dofus Unity protocol research and bot orchestration."
authors = [{ name = "Valentin Alix" }]
requires-python = ">3.12,<3.13"
readme = "README.md"

dependencies = [
    "scapy>=2.5.0,<3",
    "psutil>=6.0.0,<7",
    "cachetools>=7.0.5",
    "msgspec>=0.20.0",
    "protobuf==5.28.3",
    "schedule>=1.2.2,<2",
    "python-dotenv>=1.1.0,<2",
    "pulp>=3.2.1,<4",
    "datamodel-code-generator>=0.30.2,<0.31",
    "langchain-openai>=1.0.3,<2",
    "pycryptodomex>=3.23.0",
    "thrift>=0.20.0,<0.21",
    "wmi>=1.5.1; sys_platform == 'win32'",
    "pysocks>=1.7.1,<2.0.0",
    "pydantic>=2.11.10",
    "playwright>=1.58.0",
    "requests[socks]>=2.32",
    "pyqt6-fluent-widgets>=1.11.1",
    "vulture>=2.16",
    "python-dateutil>=2.9.0.post0,<3",
    "frida==16.7.9",
    "frida-tools>=13.7.1",
    "filelock>=3,<4",
    "numpy>=2.4.2",
    "scipy>=1.18,<2",
    "ida-domain>=0.4.0",
    "idapro>=0.0.7",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.19.0,<7",
    "ruff>=0.15.12",
    "poethepoet>=0.44.0",
    "pyright>=1.1.408",
    "PyQt6-stubs>=6.6.0",
    "types-cachetools>=5.5.0.20240820",
    "tqdm>=4.66.5,<5",
    "coverage>=7.13.1",
    "pytest>=9.0.3",
    "pytest-cov>=6.0",
    "types-psutil>=7.1.3.20251211",
    "types-python-dateutil>=2.9.0.20251115",
    "types-protobuf>=6.32.1.20251210",
    "types-requests>=2.32.4.20250913,<3",
    "scipy-stubs>=1.18,<2",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.poe.tasks]
dead_code = "vulture src AnkamaLauncherEmulator/ankama_launcher_emulator DBDofusUnity/dofus_unity_reader DBDofusUnity/proto_mapper_assembly scripts/vulture_whitelist.py --exclude \"*gen_zaap*,*proxy/dofus3/login_message_pb2.py\" --min-confidence 80"
check_type = "pyright"
lint = "ruff check . --fix"
format = "ruff format ."
check = ["lint", "check_type"]
test = "coverage run --source=src -m pytest tests"
test_verbose = "pytest tests -s"
verify = ["lint", "check_type", "test"]
package = "pyinstaller --noconfirm --clean --windowed --name Bot-DofusUnity --paths DBDofusUnity --paths AnkamaLauncherEmulator --add-data \"resources/icons;resources/icons\" --add-data \"DBDofusUnity/datas/bundles;DBDofusUnity/datas/bundles\" --add-data \"DBDofusUnity/datas/protos;DBDofusUnity/datas/protos\" --add-data \"AnkamaLauncherEmulator/ankama_launcher_emulator/server/dofus3/script.js;AnkamaLauncherEmulator/ankama_launcher_emulator/server/dofus3\" __main__.py"


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "AnkamaLauncherEmulator", "DBDofusUnity"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "-p", "no:cov",
    "-p", "no:langsmith_plugin"
]
filterwarnings = [
    "ignore::DeprecationWarning:pulp",
]

[tool.ruff]
exclude = [
  "DBDofusUnity/datas",
  "DBDofusUnity/.venv",
  "DBDofusUnity/Il2CppInspectorRedux",
  "DBDofusUnity/protodec",
  "DBDofusUnity/UABEA",
  "AnkamaLauncherEmulator/ankama_launcher_emulator/gen_zaap",
  "AnkamaLauncherEmulator/ankama_launcher_emulator/proxy/dofus3/login_message*",
  "**/.venv",
  "**/datas",
  "**/node_modules",
  "**/__pycache__",
  "**/.*"
]
line-length = 110

[tool.ruff.lint]
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["INP001"]
